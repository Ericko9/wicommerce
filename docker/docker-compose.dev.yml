version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ucp-postgres-dev
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ucp_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ucp-redis-dev
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: ucp-minio-dev
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_dev_data:/data

volumes:
  postgres_dev_data:
  redis_dev_data:
  minio_dev_data:
